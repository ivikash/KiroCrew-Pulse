<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Light ground","default":"#ffffff"},
    {"id":"color-ground-dark","type":"color","label":"Dark ground","default":"#19161d"},
    {"id":"color-ink","type":"color","label":"Text on light","default":"#000000"},
    {"id":"color-ink-dark","type":"color","label":"Text on dark","default":"#ffffff"},
    {"id":"color-muted","type":"color","label":"Muted text","default":"#5e5966"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#8e48ff"},
    {"id":"color-accent-light","type":"color","label":"Accent light","default":"#d6bbff"},
    {"id":"color-accent-tint","type":"color","label":"Accent tint","default":"#f0e8fc"},
    {"id":"color-border","type":"color","label":"Card border","default":"#e6e3ea"},
    {"id":"color-ok","type":"color","label":"OK green","default":"#008543"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"},
    {"id":"subtitle","type":"string","label":"Page subtitle","default":"What your crew is doing, what is waiting on you, and what is coming up."},
    {"id":"tagline","type":"string","label":"Outro tagline","default":"Pulse. Mission control for your crew on one page."},
    {"id":"footer-line","type":"string","label":"Footer line","default":"All systems running"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #ffffff;
        --color-ground-dark: #19161d;
        --color-ink: #000000;
        --color-ink-dark: #ffffff;
        --color-muted: #5e5966;
        --color-accent: #8e48ff;
        --color-accent-light: #d6bbff;
        --color-accent-tint: #f0e8fc;
        --color-border: #e6e3ea;
        --color-ok: #008543;
        --font-display: Inter;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground-dark);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-display), Inter, sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--color-ground-dark);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.5" data-width="1920" data-height="1080">
      <div id="bg"></div>

      <!-- Scenes. Each one fades in over its first 0.6 s on top of the previous one (soft crossfade), so hosts overlap by 0.6 s and alternate lanes. -->
      <div id="s1-hook" class="clip" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html"
        data-start="0" data-duration="4.42" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="s2-reveal" class="clip" data-composition-id="s2-reveal" data-composition-src="compositions/s2-reveal.html"
        data-start="3.82" data-duration="6.07" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <!-- beat-locked: 9.29s (strong cue, the bass has entered with the page) -->
      <div id="s3-page" class="clip" data-composition-id="s3-page" data-composition-src="compositions/s3-page.html"
        data-start="9.29" data-duration="6.04" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s4-card" class="clip" data-composition-id="s4-card" data-composition-src="compositions/s4-card.html"
        data-start="14.73" data-duration="5.53" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>
      <!-- beat-locked: 19.66s (strong cue, the wordmark lands) -->
      <div id="s5-outro" class="clip" data-composition-id="s5-outro" data-composition-src="compositions/s5-outro.html"
        data-start="19.66" data-duration="3.84" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- Music bed: Happy Beats / Business Moves vol. 12 by Sascha Ende (ende.app), CC BY 4.0. 109.96 BPM. -->
      <audio id="bg-music" class="clip" data-start="0" data-duration="23.5" data-track-index="10" data-volume="0.32" data-fade-in="0.6" data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>

      <!-- SFX (Kenney, CC0). Lane 11 holds every non-overlapping cue; lane 12 only where two overlap. -->
      <!-- beat-grid: tiles at 4.91s, 5.34s, 6.00s, 6.56s; each drop fires 0.04s before its tile -->
      <audio id="sfx-tile-1" class="clip" data-start="4.87" data-duration="0.11" data-track-index="11" data-volume="0.45" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-tile-2" class="clip" data-start="5.30" data-duration="0.11" data-track-index="11" data-volume="0.45" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-tile-3" class="clip" data-start="5.96" data-duration="0.11" data-track-index="11" data-volume="0.45" src="assets/sfx/interface/drop_001.ogg"></audio>
      <audio id="sfx-tile-4" class="clip" data-start="6.52" data-duration="0.11" data-track-index="11" data-volume="0.45" src="assets/sfx/interface/drop_001.ogg"></audio>
      <!-- the cursor picks Lakeside Lodge -->
      <audio id="sfx-click-option" class="clip" data-start="15.84" data-duration="0.01" data-track-index="11" data-volume="0.6" src="assets/sfx/interface/click_003.ogg"></audio>
      <!-- beat-locked: 17.47s (strong cue) the cursor presses Send answer -->
      <audio id="sfx-click-send" class="clip" data-start="17.47" data-duration="0.01" data-track-index="11" data-volume="0.6" src="assets/sfx/interface/click_003.ogg"></audio>
      <audio id="sfx-send-fill" class="clip" data-start="17.52" data-duration="0.13" data-track-index="12" data-volume="0.4" src="assets/sfx/interface/bong_001.ogg"></audio>
      <!-- beat-locked: 19.66s (strong cue) the wordmark lands -->
      <audio id="sfx-wordmark" class="clip" data-start="19.64" data-duration="0.19" data-track-index="11" data-volume="0.55" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
